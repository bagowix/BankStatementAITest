# Образец конфига клиента пакета inbox: турагентство в Тбилиси.
# Секретов здесь нет — только имена переменных окружения (см. .env.example).
# Проверка: uv run autostudio inbox check examples/inbox/client.toml --skip-env
# Клиента заводит `autostudio new-client <id> --package inbox`: замените demo-inbox на id клиента
# и в csv_dir ниже.

[client]
id = "demo-inbox"
name = "Demo Tours"
timezone = "Asia/Tbilisi"
language = "en"            # язык таблицы и уведомлений владельцу: en или ru

[notify]
# Чат владельца для сигналов о горячих лидах (Standard и выше). Как узнать chat_id — в
# docs/packages/inbox.md, «Запуск в работу». Токен бота — в AUTOSTUDIO_NOTIFY_BOT_TOKEN.
# telegram_chat_id = "123456789"
console = false            # true — печатать сигналы в лог сервера (только для отладки)

[sink]
backend = "csv"            # "google" + spreadsheet_id для Google Sheets
# В Docker пишется только том /data (каталог /app доступен лишь на чтение);
# для локального запуска можно указать, например, "var/out/demo-inbox".
csv_dir = "/data/demo-inbox/out"
# spreadsheet_id = "1AbC...xyz"

[inbox]
imap_host = "imap.gmail.com"               # Microsoft 365: "outlook.office365.com"
imap_port = 993
# Вход: "password" — пароль приложения (личный Gmail, Яндекс, Zoho, Mail.ru);
# "google_oauth" — Google Workspace (Internal OAuth-клиент в GCP-проекте организации клиента,
# refresh token — `autostudio inbox oauth-google`); "microsoft_oauth" — Microsoft 365
# (приложение Entra в тенанте клиента, IMAP.AccessAsApp). Пошагово — docs/packages/inbox.md.
auth = "password"
username_env = "INBOX_IMAP_USER"           # при OAuth — адрес ящика
password_env = "INBOX_IMAP_PASSWORD"       # пароль ПРИЛОЖЕНИЯ, не основной (только для "password")
# oauth_client_id_env = "INBOX_OAUTH_CLIENT_ID"
# oauth_client_secret_env = "INBOX_OAUTH_CLIENT_SECRET"
# oauth_refresh_token_env = "INBOX_OAUTH_REFRESH_TOKEN"   # Google
# oauth_tenant_id_env = "INBOX_OAUTH_TENANT_ID"           # Microsoft 365
folder = "INBOX"
drafts_folder = "[Gmail]/Drafts"           # в Gmail; check --connect подскажет точное имя
# Первый запуск заносит в таблицу письма за эти дни. Письма старше суток только
# записываются — без черновиков и сигналов: на них, скорее всего, уже ответили.
first_run_since_days = 3
max_per_run = 50
max_body_chars = 8000
notify_on_urgency = "normal"               # сообщать о каждом лиде и заявке, не только о срочных
mask_pii_in_sheet = false
alert_operator_on_injection = true
sheet_tab = "Inbox"
# Телефоны сверяются в E.164: номер без кода страны читается в регионе phone_region, а если
# такого номера там нет — в запасных регионах (русскоязычные гости пишут «8 (916) 123-45-67»).
# Из запасного региона E.164 берётся, только если запись сама называет страну («8 …», «+7 …»):
# «(917) 555-0134» идёт владельцу как написано, без номера с чужим кодом страны.
phone_region = "GE"
phone_fallback_regions = ["RU"]

# Счета из PDF-вложений писем категории invoice: модель извлекает поля, код сверяет итог с
# текстом PDF и строки с итогом. Не сошлось — строка «НЕ сверен» с расхождением. Сканы без
# текстового слоя (OCR в v1 нет) — «не разобран, откройте PDF».
[inbox.invoices]
enabled = true
categories = ["invoice"]
max_pdf_kb = 2048
max_pages = 10
sheet_tab = "Invoices"

[inbox.company]
name = "Demo Tours"
signature = """Best regards,
Demo Tours team
+995 32 200 00 00 · demotours.example"""
tone = "warm, concise and professional; short paragraphs; no pressure"
reply_language = "auto"                    # отвечать на языке отправителя
facts = [
    "Group day tours from Tbilisi: Kazbegi and Gergeti Trinity Church — 120 GEL per person; Kakheti wine tour with tastings — 140 GEL per person; Mtskheta and Jvari — 70 GEL per person.",
    "Tbilisi old town walking tour — 60 GEL per person, every day at 11:00, English or Russian-speaking guide.",
    "Private tours for groups of up to 15 people: from 450 GEL per day for the car, driver and an English- or Russian-speaking guide; multi-day programmes are quoted individually after we know the dates and the group size.",
    "To book: reply with the date, the number of people and the tour; we confirm availability within one working day and take a 20% deposit by card or bank transfer.",
    "Free cancellation up to 72 hours before the tour; later cancellations are non-refundable. Complaints are reviewed by the manager within 2 working days.",
    "Hotel pick-up in central Tbilisi is included in all tours. Lunch is not included unless stated.",
    "Office hours: Monday to Saturday, 10:00–19:00 Tbilisi time (GMT+4).",
]

# Подпись и факты на других языках: черновик на русском заканчивается русской подписью и
# опирается на русский текст фактов (те же цены — числа проверяются по всем языкам).
[inbox.company.signatures]
ru = """С уважением,
команда Demo Tours
+995 32 200 00 00 · demotours.example"""

[inbox.company.facts_by_language]
ru = [
    "Однодневные групповые туры из Тбилиси: Казбеги и церковь Гергети — 120 GEL с человека; винный тур по Кахетии с дегустацией — 140 GEL с человека; Мцхета и Джвари — 70 GEL с человека.",
    "Пешеходная экскурсия по старому Тбилиси — 60 GEL с человека, ежедневно в 11:00, гид на английском или русском.",
    "Индивидуальные туры для групп до 15 человек: от 450 GEL в день за машину, водителя и гида; многодневные программы считаем отдельно, когда знаем даты и состав группы.",
    "Как забронировать: напишите дату, число участников и тур; подтверждаем наличие мест в течение одного рабочего дня, предоплата 20% картой или переводом.",
    "Бесплатная отмена не позднее чем за 72 часа до тура; при более поздней отмене предоплата не возвращается. Жалобы менеджер рассматривает в течение 2 рабочих дней.",
    "Трансфер из отеля в центре Тбилиси включён во все туры. Обед не включён, если не указано иное.",
    "Офис работает с понедельника по субботу, 10:00–19:00 по Тбилиси (GMT+4).",
]

[[inbox.categories]]
id = "booking_request"
label = { en = "Booking request", ru = "Заявка на бронирование" }
description = "A customer wants to book or reserve a specific tour or date, or asks to confirm a booking."
lead = true
notify = true
draft_reply = true

[[inbox.categories]]
id = "lead"
label = { en = "Tour inquiry", ru = "Запрос о туре" }
description = "A potential customer asks about prices, availability, programmes or a quote, without a firm booking yet."
lead = true
notify = true
draft_reply = true

[[inbox.categories]]
id = "support"
label = { en = "Customer issue", ru = "Вопрос или жалоба клиента" }
description = "An existing customer: a question about their booking, a change, a complaint or a refund request."
draft_reply = true

[[inbox.categories]]
id = "invoice"
label = { en = "Invoice", ru = "Счёт" }
description = "Invoices, bills, payment requests or receipts from hotels, drivers and other partners."
move_to = "Invoices"

[[inbox.categories]]
id = "marketing"
label = { en = "Newsletter or promotion", ru = "Рассылка или реклама" }
description = "Newsletters, promotions, cold sales pitches, SEO or advertising offers and other bulk mail."
move_to = "Newsletters"

[[inbox.categories]]
id = "other"
label = { en = "Other", ru = "Прочее" }
description = "Anything else: personal, internal, partner chatter, service notifications, unclear messages."
