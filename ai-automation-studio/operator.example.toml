# Образец профиля оператора для `autostudio office` (счета, книга поступлений, договоры).
#
# Скопируйте в operator.toml в корне репозитория и впишите реквизиты своего ИП:
#     cp operator.example.toml operator.toml
# operator.toml в .gitignore (как и любые operator*.toml, кроме этого образца): репозиторий
# зеркалируется в публичный, а IBAN и адрес ИП туда попадать не должны. Здесь — только
# вымышленные данные.
#
# Другой путь к файлу: флаг --operator или переменная AUTOSTUDIO_OPERATOR.
# Проверка при каждом запуске: IBAN (контрольная сумма ISO 13616), форма SWIFT/BIC,
# 9–11 цифр ID, e-mail. Значения-образцы ниже («Example», «Пример», example.com, ID из
# нулей, SWIFT на XXXX, IBAN с неверной контрольной суммой) профиль не примет: забытая
# строка образца не попадёт в счёт клиенту.
#
# Необязательные поля закомментированы. Раскомментируйте только те, что заполните своими
# данными: пустое поле в счёт не печатается, а договор без нужного поля не соберётся и
# назовёт, чего не хватает.

# --- обязательные -------------------------------------------------------------------------

# Наименование для счетов — как в выписке из реестра ИП.
legal_name = "Individual Entrepreneur Jane Example"
# Идентификационный номер ИП.
id_number = "000000000"
# Юридический адрес ИП.
address = "Georgia, Batumi, Example Street 1, Apartment 1"

# Счёт ИП. В счёте клиенту печатаются получатель, IBAN, банк, SWIFT и номер счёта как назначение платежа.
bank_name = "JSC Example Bank"
iban = "GE00XX0000000000000000"
swift = "XXXXGE22"

email = "jane@example.com"

# --- необязательные -----------------------------------------------------------------------

# Для счетов на русском.
# legal_name_ru = "ИП Джейн Пример"
# Имя человека для договоров ({{NAME}}). Не задано — берётся legal_name без «Individual Entrepreneur».
# owner_name = "Jane Example"
# Контакты в шапке счёта.
# phone = "+995 500 00 00 00"
# website = "https://example.com"
# Telegram без @ — для договоров ({{TELEGRAM}}).
# telegram = "jane_example"

# Для переводов из-за границы: адрес банка и банк-посредник (корреспондент) для USD —
# их спрашивает банк плательщика. Возьмите у своего банка (инструкция для входящих SWIFT в USD).
# bank_address = "Example Avenue 1, Tbilisi, Georgia"
# intermediary_bank = "Example Correspondent Bank, New York"
# intermediary_swift = "XXXXUS33"

# Префикс номера счёта: AS-2026-001, AS-2026-002, … (нумерация по календарному году).
# invoice_prefix = "AS-"
# Валюта счёта по умолчанию: USD, EUR или GEL.
# default_currency = "USD"

# Другие способы оплаты под реквизитами (например, Wise ACH для клиентов из США: бриф 2.2).
# [payment_note]
# en = "US clients: ACH to Example Bank, routing 000000000, account 0000000000 (Jane Example)."
# ru = "Клиентам из США: ACH в Example Bank, routing 000000000, account 0000000000."

# Строка о налогах внизу счёта. По умолчанию — как ниже; формулировку подтвердите у бухгалтера (docs/office.md).
# [tax_note]
# en = "Small Business status holder — VAT is not charged."
# ru = "Статус малого бизнеса — НДС не начисляется."

# Остальные поля {{…}} шаблонов договоров docs/legal (одни для всех клиентов).
# Имя, ID, адрес, e-mail, Telegram и банк берутся из полей выше.
# [contract_fields]
# SERVER_LOCATION = "Example Country (city)"
# HOSTING_PROVIDER = "Example Hosting GmbH"
# BACKUP_PROVIDER = "Example Storage Ltd"
# BACKUP_LOCATION = "Example Country"
