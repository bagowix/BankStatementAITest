# Режим очереди: Redis плюс отдельный воркер. Без этого файла стенд работает в
# одном процессе и никакой инфраструктуры не требует — см. README.
services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
